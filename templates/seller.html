<!doctype html>
<html lang="en">

<head>
    <title>KU Student Marketplace | Become Seller</title>
    <link rel="stylesheet" href="../public/css/style.css">
    <link rel="stylesheet" href="../public/css/darkmode.css">
    <!-- Favicon Coming Soon -->
    <link rel="shortcut icon" type="image/ico" href="../public/favicon.ico">
</head>

<body>
    <div class="topnav">
        <a class="topButton" href="/">Marketplace</a>
        <a class="active" href="/seller">Become Seller</a>
        <a class="topButton" href="/logout">Logout</a>
    </div>

    <button id="theme-switch">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px">
            <path
                d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z">
            </path>
        </svg>
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px">
            <path
                d="M480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z">
            </path>
        </svg>
    </button>
    <script src="../public/scripts/darkmode.js"></script>

    <div align="center">
        <h1>Become a Seller</h1>
        <p>Fill out the form below to become a seller on the KU Student Marketplace. TODO</p>
        <form method="post" style="display: flex; flex-direction: column; max-width: 400px;">
            {% if error != None %}
            <p class="WrongInput">{{error}}</p>
            {% else %}
            <br>
            {% endif %}
            <input type="submit" value="Register" />
        </form>
    </div>
</body>

</html>
